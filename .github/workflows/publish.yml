name: Publish CasaOS image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-casaos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ARM64 and AMD64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/filipekav/baseguard:latest
            ghcr.io/filipekav/baseguard:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Installation links
        run: |
          echo 'Image: `ghcr.io/filipekav/baseguard:latest`' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compose: https://raw.githubusercontent.com/filipekav/BaseGuard/main/compose.casaos.yaml' >> "$GITHUB_STEP_SUMMARY"
          echo 'The GHCR package must be public for anonymous installation from CasaOS.' >> "$GITHUB_STEP_SUMMARY"

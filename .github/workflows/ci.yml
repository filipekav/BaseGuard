name: Validate
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: |
          if [ "${{ matrix.runner }}" = "ubuntu-24.04" ]; then
            go test -race ./... -count=1
          else
            go test ./... -count=1
          fi
      - run: go vet ./...
      - name: Cross-compile ARM64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/baseguard-arm64 ./cmd/baseguard
      - name: Validate Compose manifests
        run: |
          docker compose config -q
          docker compose -f compose.casaos.yaml config -q
          docker compose -f compose.test.yaml config -q
      - name: Build application image
        run: docker compose build
      - name: Test CasaOS initialization and privilege drop
        run: sh scripts/test-container.sh
      - name: Prepare exFAT kernel support
        run: sh scripts/prepare-exfat-ci.sh
      - name: Test CasaOS exFAT volumes
        run: sh scripts/test-exfat.sh
      - name: Backup and restore integration tests
        run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests
      - name: Clean up disposable integration services
        if: always()
        run: docker compose -f compose.test.yaml down -v
